name: Release Dih
on:
  push:
    tags: ['v*']
permissions:
  contents: write

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Build Dih Client 1.21.11
        working-directory: client-mod/reference-1.21.11
        run: gradle --no-daemon clean build --stacktrace
      - name: Stage client jar
        shell: bash
        run: |
          mkdir -p release-client
          cp client-mod/reference-1.21.11/build/libs/dih-client-1.0.0.jar release-client/dih-client-1.21.11-v1.0.0.jar
          sha256sum release-client/dih-client-1.21.11-v1.0.0.jar > release-client/dih-client-1.21.11-v1.0.0.jar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: release-client
          path: release-client/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Verify and build
        run: npm run dist:win
      - name: SHA-256
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            $hash=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -NoNewline "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/*.exe
            dist/*.exe.sha256
          if-no-files-found: error

  publish:
    needs: [client, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-client
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
