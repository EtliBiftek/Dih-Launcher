name: Build Dih Client 1.21.11

on:
  workflow_dispatch:
  push:
    paths:
      - 'client-mod/reference-1.21.11/**'
      - '.github/workflows/build-client-1.21.11.yml'
  pull_request:
    paths:
      - 'client-mod/reference-1.21.11/**'
      - '.github/workflows/build-client-1.21.11.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-mod/reference-1.21.11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Build client
        run: gradle --no-daemon clean build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: dih-client-1.21.11
          path: client-mod/reference-1.21.11/build/libs/*.jar
