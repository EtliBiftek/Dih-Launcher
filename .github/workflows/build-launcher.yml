name: Build Dih Launcher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-launcher.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-launcher.yml'

permissions:
  contents: write

concurrency:
  group: dih-launcher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Detect lockfile
        id: lock
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            "missing=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "missing=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
      - name: Generate lockfile when missing
        if: steps.lock.outputs.missing == 'true'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile to PR branch
        if: github.event_name == 'pull_request' && steps.lock.outputs.missing == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock npm dependencies"
          git push origin HEAD:${{ github.head_ref }}
      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify offline runtime APIs
        run: npm run verify
      - name: Verify Mojang and Fabric metadata
        run: node scripts/xmcl-online-smoke.js
      - name: Build NSIS installer
        run: npx electron-builder --win nsis
      - name: Create SHA-256 files
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -NoNewline "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Dih-Launcher-Windows
          path: |
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error
