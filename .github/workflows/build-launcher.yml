name: Build Dih Launcher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-launcher.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-launcher.yml'

permissions:
  contents: read

concurrency:
  group: dih-launcher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify offline runtime APIs
        run: npm run verify
      - name: Verify Mojang and Fabric metadata
        run: node scripts/xmcl-online-smoke.js
      - name: Build NSIS installer
        run: npx electron-builder --win nsis --publish never
      - name: Create SHA-256 files
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -NoNewline "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Dih-Launcher-Windows
          path: |
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error
